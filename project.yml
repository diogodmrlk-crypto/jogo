name: LARP

options:
  bundleIdPrefix: com.indie
  deploymentTarget:
    iOS: "15.0"

targets:
  LARP:
    type: application
    platform: iOS

    sources:
      - path: LA_RP
        excludes:
          - Web

    resources:
      - path: LA_RP/Web
        type: folder

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.indie.larp
        PRODUCT_NAME: LARP
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "LA RP"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
