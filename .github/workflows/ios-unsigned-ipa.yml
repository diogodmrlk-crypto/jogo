name: Build LA RP iOS

on:
  workflow_dispatch:
  push:
    branches:
      - html-to-ts-generator

permissions:
  contents: read

jobs:
  build:
    name: Build LA RP
    runs-on: macos-latest

    steps:
      # 1. Baixar o repositório
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: html-to-ts-generator

      # 2. Verificar arquivos de origem
      - name: Check game files
        run: |
          set -e

          test -f project.yml
          test -f LA_RP/App.swift
          test -f LA_RP/GameView.swift
          test -f LA_RP/Web/index.html
          test -f LA_RP/Web/style.css
          test -f LA_RP/Web/game.js

          echo "Todos os arquivos encontrados!"

      # 3. Instalar XcodeGen
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      # 4. Gerar projeto Xcode
      - name: Generate Xcode project
        run: |
          xcodegen generate

      # 5. Compilar aplicativo
      - name: Build iOS application
        run: |
          set -o pipefail

          xcodebuild \
            -project LARP.xcodeproj \
            -scheme LARP \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # 6. Localizar aplicativo
      - name: Locate application
        id: locate
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos \
            -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERRO: aplicativo não encontrado."
            exit 1
          fi

          echo "Aplicativo encontrado: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      # 7. COPIAR HTML, CSS E JS PARA O APP
      - name: Copy game web files
        run: |
          set -e

          APP_PATH="${{ steps.locate.outputs.app_path }}"

          mkdir -p "$APP_PATH/Web"

          cp -R LA_RP/Web/. "$APP_PATH/Web/"

          echo "Arquivos copiados:"
          find "$APP_PATH/Web" -maxdepth 2 -type f

      # 8. Verificar arquivos dentro do aplicativo
      - name: Verify game files
        run: |
          set -e

          APP_PATH="${{ steps.locate.outputs.app_path }}"

          test -f "$APP_PATH/Web/index.html"
          test -f "$APP_PATH/Web/style.css"
          test -f "$APP_PATH/Web/game.js"

          echo "SUCESSO: os três arquivos estão dentro do APP!"

      # 9. Criar IPA
      - name: Package IPA
        run: |
          set -e

          APP_PATH="${{ steps.locate.outputs.app_path }}"

          mkdir -p output/Payload

          cp -R "$APP_PATH" output/Payload/

          cd output

          zip -qry LA-RP-unsigned.ipa Payload

          ls -lh LA-RP-unsigned.ipa

      # 10. Publicar artefato
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LA-RP-Unsigned-IPA
          path: output/LA-RP-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
