<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Los Angeles RP</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="game.js" defer></script>
</head>

<body>

    <div id="game">

        <canvas id="renderCanvas"></canvas>

        <div id="hud">

            <div class="topbar">
                <div class="brand">
                    <strong>LOS ANGELES</strong>
                    <span>ROLEPLAY</span>
                </div>

                <div class="money">
                    <span>DINHEIRO</span>
                    <strong>$ 25.000</strong>
                </div>

                <div class="player-info">
                    <strong>JOGADOR</strong>
                    <span>ONLINE</span>
                </div>
            </div>

            <div class="status">
                <div class="status-item">
                    <span>♥ VIDA</span>
                    <div class="bar">
                        <div class="health-fill"></div>
                    </div>
                </div>

                <div class="status-item">
                    <span>🍔 FOME</span>
                    <div class="bar">
                        <div class="hunger-fill"></div>
                    </div>
                </div>

                <div class="status-item">
                    <span>💧 SEDE</span>
                    <div class="bar">
                        <div class="thirst-fill"></div>
                    </div>
                </div>
            </div>

            <div class="minimap">
                <canvas id="mapCanvas" width="160" height="160"></canvas>
                <span>LOS ANGELES</span>
            </div>

            <div id="toast"></div>

            <div class="bottom-ui">

                <div class="joystick-area" id="joystick">
                    <div class="joystick-base">
                        <div class="joystick-knob" id="joystickKnob"></div>
                    </div>
                </div>

                <div class="actions">
                    <button id="jumpButton">PULAR</button>
                    <button id="sprintButton">CORRER</button>
                    <button id="interactButton">AÇÃO</button>
                </div>

            </div>

            <div class="look-area" id="lookArea"></div>

            <div class="speedometer">
                <strong id="speed">0</strong>
                <span>KM/H</span>
            </div>

            <div class="crosshair">+</div>

        </div>
    </div>

</body>
</html>
